<!DOCTYPE html>
<html>
  <head>
    <title>Hello, Flask!</title>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #333;
        color: white;
        padding: 10px;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin: 0 10px;
        font-size: 20px;
      }

      button {
        margin: 10px;
        padding: 5px 10px;
        border-radius: 5px;
        background-color: #333;
        color: white;
        border: none;
        cursor: pointer;
      }

      form {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 50px;
      }

      input[type="file"] {
        margin: 20px;
      }

      input[type="submit"] {
        padding: 5px 10px;
        border-radius: 5px;
        background-color: #333;
        color: white;
        border: none;
        cursor: pointer;
      }
      #submitBtn {
        padding: 0.5em 1em;
        font-size: 1.5em;
      }
    </style>
  </head>
  <body>
    <nav>
      <div>
        <a href="/">Home</a>
        <a href="/arbitration">Arbitration</a>
      </div>
      <button id="connectWallet" onclick="">Log into Metamask account</button>
    </nav>
    <h1>Hello, Flask!</h1>
    <h3>Connect Your MetaMask Wallet Here!</h3>
    <!-- <button id="connectWallet" onclick="">Connect Wallet</button> -->
    <p id="walletAddress"></p>
    <form method="POST" enctype="multipart/form-data">
      <label for="image_file">Select an image:</label>
      <input type="file" name="image_file" id="image_file" />
      <br />
      <label for="text_file">Select a text file:</label>
      <input type="file" name="text_file" id="text_file" />
      <br />
      <button type="submit" id="submitBtn">Submit</button>
    </form>

    {% if img_name %}
    <div>
      <h3>
        The image below is the closest match to your image: download it here!
      </h3>
      <form action="./download" method="post">
        <input type="hidden" value="{{ img_name }}" name="img_name" />
        <input type="submit" value="Download" />
      </form>
      <img id="picture" src="data:image/jpeg;base64,{{ img_data }}" />
    </div>
    {% endif %}

    <script type="text/javascript">
      window.userWalletAddress = null;
      const connectWallet = document.getElementById("connectWallet");
      const walletAddress = document.getElementById("walletAddress");

      function checkInstalled() {
        if (typeof window.ethereum == "undefined") {
          connectWallet.innerText =
            "MetaMask isnt installed, please install it";
          connectWallet.classList.remove();
          connectWallet.classList.add();
          return false;
        }
        connectWallet.addEventListener("click", connectWalletwithMetaMask);
      }

      async function connectWalletwithMetaMask() {
        const accounts = await window.ethereum
          .request({ method: "eth_requestAccounts" })
          .catch((e) => {
            console.error(e.message);
            return;
          });

        if (!accounts) {
          return;
        }

        window.userWalletAddress = accounts[0];
        walletAddress.innerText = window.userWalletAddress;
        // make an axios call to the backend to send the wallet address
        axios
          .post("http://127.0.0.1:5000/api/wallet", {
            walletAddress: String(window.userWalletAddress),
          })
          .then((res) => {
            console.log(res);
            connectWallet.innerText = "Sign Out";
            connectWallet.removeEventListener(
              "click",
              connectWalletwithMetaMask
            );
            setTimeout(() => {
              connectWallet.addEventListener("click", signOutOfMetaMask);
            }, 200);
          })
          .catch((err) => {
            console.log(err);
          });
      }

      function signOutOfMetaMask() {
        window.userwalletAddress = null;
        walletAddress.innerText = "";
        connectWallet.innerText = "Connect Wallet";
        // make a get axios call to backend to indicate signing out
        axios
          .get("http://127.0.0.1:5000/api/wallet")
          .then((res) => {
            console.log(res);
            connectWallet.removeEventListener("click", signOutOfMetaMask);
            setTimeout(() => {
              connectWallet.addEventListener(
                "click",
                connectWalletwithMetaMask
              );
            }, 200);
          })
          .catch((err) => {
            console.log(err);
          });
      }

      window.addEventListener("DOMContentLoaded", () => {
        axios
          .get("http://127.0.0.1:5000/api/wallet")
          .then((res) => {
            console.log(res);
          })
          .catch((err) => {
            console.log(err);
          });
        checkInstalled();
      });
    </script>
  </body>
</html>
