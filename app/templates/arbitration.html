<!DOCTYPE html>
<html>
<head>
	<title>Arbitration Page</title>
	<style>
		nav {
			display: flex;
			justify-content: space-between;
			align-items: center;
			background-color: #333;
			color: white;
			padding: 10px;
		}

		nav a {
			color: white;
			text-decoration: none;
			margin: 0 10px;
			font-size: 20px;
		}

		button {
			margin: 10px;
			padding: 5px 10px;
			border-radius: 5px;
			background-color: #333;
			color: white;
			border: none;
			cursor: pointer;
		}

		form {
			display: flex;
			flex-direction: column;
			align-items: center;
			margin: 50px;
		}

		input[type=file] {
			margin: 20px;
		}

		input[type=submit] {
			padding: 5px 10px;
			border-radius: 5px;
			background-color: #333;
			color: white;
			border: none;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<nav>
		<div>
			<a href="#">Home</a>
			<a href="#">Arbitration</a>
		</div>
		<button>Log into Metamask account</button>
	</nav>

	<form action="/arbitrate" method="post">
		<label for="file-input">Choose a file:</label>
		<input type="file" id="file-input" name="file-input"><br>
		<input type="submit" value="Arbitrate">
	</form>
</body>
</html>
